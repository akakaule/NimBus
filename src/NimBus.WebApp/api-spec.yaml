          type: array
          items:
            type: string
        deletedRules:
          type: array
          items:
            type: string
        errors:
          type: array
          items:
            type: string
    ServiceBusTopicOverview:
      title: ServiceBusTopicOverview
      type: object
      properties:
        name:
          type: string
        isSystemTopic:
          type: boolean
          description: The platform's own Resolver topic rather than an endpoint topic
        isKnownToPlatform:
          type: boolean
          description: False for a topic with no matching platform endpoint
        status:
          type: string
          description: 'Service Bus EntityStatus: Active | SendDisabled | ReceiveDisabled | Disabled'
        subscriptionCount:
          type: integer
        activeMessageCount:
          type: integer
          format: int64
        deadLetterMessageCount:
          type: integer
          format: int64
        transferMessageCount:
          type: integer
          format: int64
          description: Messages awaiting auto-forward out of this topic's subscriptions
        transferDeadLetterMessageCount:
          type: integer
          format: int64
          description: >-
            Messages Service Bus could not auto-forward. Azure strands these in a
            separate transfer dead-letter queue, so a page reporting only the regular
            one reads as "zero dead letters" in exactly the failed-forwarding incident
            this view diagnoses.
        scheduledMessageCount:
          type: integer
          format: int64
        sizeInBytes:
          type: integer
          format: int64
    ServiceBusSubscriptionInfo:
      title: ServiceBusSubscriptionInfo
      type: object
      properties:
        name:
          type: string
        topicName:
          type: string
        status:
          type: string
          description: 'Service Bus EntityStatus: Active | ReceiveDisabled | Disabled'
        requiresSession:
          type: boolean
        forwardTo:
          type: string
          nullable: true
          description: Auto-forward destination; null for a terminal subscription
        expectedForwardTo:
          type: string
          nullable: true
          description: >-
            Where the platform topology says this subscription should forward. When
            set and forwardTo is null, forwarding is detached — a paused subscription,
            or a pause that was never resumed.
        ruleNames:
          type: array
          items:
            type: string
        missingRuleNames:
          type: array
          items:
            type: string
          description: Expected rules absent from the subscription (detached, or never created)
        detachableRuleNames:
          type: array
          items:
            type: string
          description: >-
            Rules the platform topology can put back, and therefore the only ones
            safe to offer as a reversible detach.
        canRecreate:
          type: boolean
          description: Whether the platform has a recipe to rebuild this subscription after deletion
        activeMessageCount:
          type: integer
          format: int64
        deadLetterMessageCount:
          type: integer
          format: int64
        transferMessageCount:
          type: integer
          format: int64
        transferDeadLetterMessageCount:
          type: integer
          format: int64
        totalMessageCount:
          type: integer
          format: int64
        accessedAt:
          type: string
          format: date-time
