        '204':
          description: No message available in the wait window
  /api/agent/publish:
    post:
      summary: Publish an event
      operationId: post-agent-publish
      tags:
        - Agent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentPublishRequest'
      responses:
        '200':
          description: OK
        '400':
          description: Payload failed schema validation
        '404':
          description: Unknown eventTypeId
  /api/agent/settle:
    post:
      summary: Settle a received event
      operationId: post-agent-settle
      tags:
        - Agent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentSettleRequest'
      responses:
        '200':
          description: OK
  /api/access-control:
    get:
      summary: Get the site-wide access-control lists
      operationId: get-access-control
      tags:
        - AccessControl
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessControlSet'
        '403':
          description: Forbidden
  /api/access-control/roles:
    post:
      summary: Grant a site-wide role to an email address or Entra object id
      operationId: post-access-control-role
      tags:
        - AccessControl
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleEntry'
      responses:
        '200':
          description: OK — returns the updated access-control lists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessControlSet'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
    delete:
      summary: Revoke a site-wide role entry
      operationId: delete-access-control-role
      tags:
        - AccessControl
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleEntry'
      responses:
        '200':
          description: OK — returns the updated access-control lists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessControlSet'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
  /api/access-control/me:
    get:
      summary: Get the current user's resolved access
      operationId: get-access-control-me
      tags:
        - AccessControl
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserAccessInfo'
  '/api/access-control/endpoint/{endpointId}':
    parameters:
      - schema:
          type: string
        name: endpointId
        in: path
        required: true
    get:
      summary: Get one endpoint's access-control lists
      operationId: get-endpoint-access-control
      tags:
        - AccessControl
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessControlSet'
        '403':
          description: Forbidden
        '404':
          description: Endpoint not found
  '/api/access-control/endpoint/{endpointId}/roles':
    parameters:
      - schema:
          type: string
        name: endpointId
        in: path
        required: true
    post:
      summary: Grant an endpoint-scoped role (piiReader is site-scoped and rejected)
      operationId: post-endpoint-access-control-role
      tags:
        - AccessControl
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleEntry'
      responses:
        '200':
          description: OK — returns the updated access-control lists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessControlSet'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Endpoint not found
    delete:
      summary: Revoke an endpoint-scoped role entry
      operationId: delete-endpoint-access-control-role
      tags:
        - AccessControl
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleEntry'
      responses:
        '200':
          description: OK — returns the updated access-control lists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessControlSet'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Endpoint not found
